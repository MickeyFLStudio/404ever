[package]
name = "ts404_host"
version = "0.1.0"
edition = "2021"
description = "Hosts the TS404 panel (WebView2) as a child window inside FL Studio's TS404 plugin window"

[lib]
crate-type = ["cdylib"]

[dependencies]
webview2-com = "0.38.2"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
debug = false
